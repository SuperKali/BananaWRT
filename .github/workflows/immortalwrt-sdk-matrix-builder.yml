#
# immortalwrt-sdk-matrix-builder.yml — build SDK tarballs per-arch via
# compile.sh --no-package (bare-metal); workflow owns SDK extraction + upload.
#
# Copyright (c) 2024-2026 SuperKali <hello@superkali.me> — MIT.
#

name: BananaWRT SDK Matrix Builder

on:
  repository_dispatch:
  workflow_call:
    inputs:
      versions:
        description: 'Exact upstream versions to build, comma-separated'
        required: true
        type: string
      architecture:
        type: string
        default: ALL
      nproc:
        type: string
        default: ''
    outputs:
      receipt:
        description: 'SDK versions, architectures, filenames and checksums published by this run'
        value: ${{ jobs.upload-to-ftp.outputs.receipt }}
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select the release type'
        required: true
        type: choice
        options:
          - stable
          - oldstable
          - nightly
          - mtk-vendor
        default: stable
      architecture:
        description: 'Select architecture to build for (use X64 for mtk-vendor)'
        required: true
        type: choice
        options:
          - ALL
          - X64
          - ARM64
        default: 'ALL'
      nproc:
        description: 'Specify the number of threads to use on the compiler'
        required: false
        default: ''

env:
  TZ: Europe/Rome

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and set up build matrix
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          VERSIONS: ${{ inputs.versions }}
          TRACK: ${{ inputs.release_type }}
          ARCH: ${{ inputs.architecture }}
        run: |
          if [ -n "$VERSIONS" ]; then
            PLAN=$(python3 -I scripts/builder/sdk-plan.py --versions "$VERSIONS")
          else
            PLAN=$(python3 -I scripts/builder/sdk-plan.py --track "$TRACK")
          fi

          case "$ARCH" in
            ALL) ARCHS=(X64 ARM64) ;;
            X64|ARM64) ARCHS=("$ARCH") ;;
            *) echo "::error::Unsupported SDK architecture: $ARCH"; exit 1 ;;
          esac

          # Count free self-hosted runners per arch (online + idle)
          RUNNERS_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" 2>/dev/null || echo '{"runners":[]}')
          ARM64_FREE=$(echo "$RUNNERS_JSON" | jq '[.runners[] | select(.status == "online") | select(.busy == false) | select([.labels[].name] | contains(["self-hosted", "ARM64"]))] | length')
          X64_FREE=$(echo "$RUNNERS_JSON"   | jq '[.runners[] | select(.status == "online") | select(.busy == false) | select([.labels[].name] | contains(["self-hosted", "X64"]))]   | length')
          echo "Free self-hosted runners — ARM64: $ARM64_FREE, X64: $X64_FREE"

          # First N items per arch claim self-hosted slots, rest spill to GitHub-hosted
          ARM64_USED=0
          X64_USED=0
          INCLUDES='[]'
          ROWS=$(jq -er '.[] | [.version, .version_line, .track] | @tsv' <<< "$PLAN")
          while IFS=$'\t' read -r V VL T; do
            for A in "${ARCHS[@]}"; do
              if [ "$A" = "ARM64" ]; then
                if [ "$ARM64_USED" -lt "$ARM64_FREE" ]; then
                  RUNNER='["self-hosted","ARM64"]'
                  ARM64_USED=$((ARM64_USED + 1))
                else
                  RUNNER='"ubuntu-24.04-arm"'
                fi
              else
                if [ "$X64_USED" -lt "$X64_FREE" ]; then
                  RUNNER='["self-hosted","X64"]'
                  X64_USED=$((X64_USED + 1))
                else
                  RUNNER='"ubuntu-latest"'
                fi
              fi
              INCLUDES=$(jq -c --arg v "$V" --arg a "$A" --argjson r "$RUNNER" \
                  --arg vl "$VL" --arg track "$T" \
                  '. + [{version: $v, arch: $a, runner: $r, version_line: $vl, track: $track}]' <<< "$INCLUDES")
            done
          done <<< "$ROWS"

          MATRIX=$(jq -nc --argjson inc "$INCLUDES" '{include: $inc}')
          echo "Generated matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-sdk:
    name: SDK ${{ matrix.arch }} / ${{ matrix.version }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      BANANAWRT_ARCH: ${{ matrix.arch }}
      BANANAWRT_IMMORTALWRT_VER: ${{ matrix.version }}
      BANANAWRT_VERSION_LINE: ${{ matrix.version_line }}
      BANANAWRT_TRACK: ${{ matrix.track }}
      BANANAWRT_JOBS: ${{ inputs.nproc }}
    steps:
      - name: Clean previous workspace
        run: |
          # Reclaim ownership before actions/checkout tries to refresh the tree
          # — legacy Docker-era runs left root-owned objects under .git/.
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE" 2>/dev/null || true
          fi
          sudo rm -rf workspace sdk-artifacts 2>/dev/null || rm -rf workspace sdk-artifacts 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: /bin/bash .github/scripts/setup-env.sh setup

      - name: Set timezone
        run: sudo timedatectl set-timezone "$TZ" || true

      - name: Authenticate git (upstream ImmortalWRT access)
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config --global user.name  'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git config --global --add safe.directory '*'
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            printf 'machine github.com login %s\n' "$GITHUB_TOKEN" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi

      - name: Run compile.sh (no package stage)
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          ./compile.sh --no-package \
            --version-line "${BANANAWRT_VERSION_LINE}" \
            --track "${BANANAWRT_TRACK}" \
            --arch "${BANANAWRT_ARCH}" \
            --immortalwrt-version "${BANANAWRT_IMMORTALWRT_VER}" \
            ${BANANAWRT_JOBS:+--jobs "${BANANAWRT_JOBS}"}

      - name: Extract SDK artefact + metadata
        run: |
          TREE="workspace/immortalwrt"
          SDK_PATH=$(find "$TREE/bin/targets" -name "*sdk*" -type f | grep -v sha256sum | head -n 1)
          CONFIG_PATH=$(find "$TREE/bin/targets" -name "config.buildinfo" | head -n 1)

          if [ -z "$SDK_PATH" ] || [ ! -s "$CONFIG_PATH" ]; then
            echo "::error::SDK tarball or config.buildinfo not found under $TREE/bin/targets"
            exit 1
          fi

          SDK_FILENAME=$(basename "$SDK_PATH")
          SDK_SHA256=$(sha256sum "$SDK_PATH" | cut -d' ' -f1)
          SDK_SIZE=$(stat -c%s "$SDK_PATH")
          TARGET=$(echo "$SDK_FILENAME" | sed -n 's/immortalwrt-sdk-.*-\(.*\)_gcc.*/\1/p')

          OUT="sdk-artifacts/bananawrt/sdk/${BANANAWRT_ARCH}/${BANANAWRT_IMMORTALWRT_VER}"
          mkdir -p "$OUT"
          cp "$SDK_PATH" "$CONFIG_PATH" "$OUT/"

          cat > "$OUT/sdk-info.json" <<EOF
          {
            "version": "${BANANAWRT_IMMORTALWRT_VER}",
            "architecture": "${BANANAWRT_ARCH}",
            "target": "$TARGET",
            "filename": "$SDK_FILENAME",
            "buildDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sha256": "$SDK_SHA256",
            "size": $SDK_SIZE,
            "download_url": "https://repo.superkali.me/bananawrt/sdk/${BANANAWRT_ARCH}/${BANANAWRT_IMMORTALWRT_VER}/$SDK_FILENAME"
          }
          EOF

      - name: Upload SDK artefact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.arch }}-${{ matrix.version }}
          path: sdk-artifacts
          retention-days: 1

      - name: Cleanup build tree
        if: always()
        run: |
          rm -rf workspace/immortalwrt/build_dir workspace/immortalwrt/tmp 2>/dev/null || true
          rm -f  "$HOME/.netrc" 2>/dev/null || true

  upload-to-ftp:
    name: Publish SDKs to repo.superkali.me
    needs: [prepare, build-sdk]
    runs-on: ubuntu-latest
    concurrency:
      group: sdk-cdn-publish
      queue: max
    outputs:
      receipt: ${{ steps.stage.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download all SDK artefacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Stage SDKs and merge the public master index
        id: stage
        env:
          SDK_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          current=$(mktemp)
          trap 'rm -f "$current"' EXIT
          curl --proto '=https' --fail --silent --show-error --retry 2 \
              --header 'Cache-Control: no-cache' --max-time 30 -o "$current" \
              'https://repo.superkali.me/bananawrt/sdk/sdk-master-index.json'
          receipt=$(python3 -I scripts/builder/stage-sdk-release.py \
              all-artifacts ftp-upload/bananawrt/sdk "$current")
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Upload to FTP
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            set cmd:fail-exit true;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }};
            mirror --reverse --verbose --only-newer --parallel=2 --exclude-glob sdk-master-index.json \
                ftp-upload/bananawrt/sdk /bananawrt/sdk;
            put ftp-upload/bananawrt/sdk/sdk-master-index.json -o /bananawrt/sdk/sdk-master-index.json;
            quit
          "

      - name: Summary
        run: |
          {
            echo '## BananaWRT SDK publish'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Repository | https://repo.superkali.me/bananawrt/sdk/ |'
            echo '| Matrix | `${{ needs.prepare.outputs.matrix }}` |'
          } >> "$GITHUB_STEP_SUMMARY"
