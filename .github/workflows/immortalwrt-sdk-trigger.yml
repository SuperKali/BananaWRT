# Build SDKs, packages and firmware when main adopts a new ImmortalWrt version.
name: Publish SDKs, Packages and Firmware on Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'config/*/version.json'

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      firmware: ${{ steps.plan.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find active upstream versions that changed
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          plan=$(python3 -I scripts/builder/sdk-plan.py --before "$BASE_SHA")
          versions=$(jq -r 'map(.version) | join(",")' <<< "$plan")
          firmware=$(jq -cn --argjson plan "$plan" '{include:$plan}')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "Versions to build: ${versions:-none}"

  sdk:
    needs: versions
    if: needs.versions.outputs.versions != ''
    uses: ./.github/workflows/immortalwrt-sdk-matrix-builder.yml
    with:
      versions: ${{ needs.versions.outputs.versions }}
      architecture: ALL
    secrets: inherit

  packages:
    needs: [versions, sdk]
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for published SDKs and dispatch the package builder
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          SDK_VERSIONS: ${{ needs.versions.outputs.versions }}
          SDK_RECEIPT: ${{ needs.sdk.outputs.receipt }}
        run: bash scripts/builder/trigger-sdk-packages.sh

  package-deploy:
    needs: [versions, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      packages_sha: ${{ steps.wait.outputs.packages_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the exact signed package deployment
        id: wait
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PACKAGE_RUN_ID: ${{ needs.packages.outputs.run_id }}
          SDK_VERSIONS: ${{ needs.versions.outputs.versions }}
        run: bash scripts/builder/wait-sdk-packages.sh

  firmware:
    needs: [versions, package-deploy]
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.firmware) }}
    uses: ./.github/workflows/immortalwrt-builder.yml
    with:
      version_line: ${{ matrix.version_line }}
      immortalwrt_version: ${{ matrix.version }}
      release_type: ${{ matrix.track }}
      packages_sha: ${{ needs.package-deploy.outputs.packages_sha }}
    secrets: inherit
